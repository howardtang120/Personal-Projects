{% extends "encyclopedia/layout.html" %}

{% block title %}
    Edit page {{ entry }}
{% endblock %}


{% block body %}
<form action="{% url 'edit_page' entry%}" method="POST">
    {% csrf_token %}
    <h3>{{ entry }}</h3>

    <div>
        {{ entry_form.content.label_tag }}<br>
        {{ entry_form.content }}
    </div>

    <input type="submit" value="Submit">
    <input type="hidden" name="entry" value={{entry}} />

</form>
{% endblock %}
