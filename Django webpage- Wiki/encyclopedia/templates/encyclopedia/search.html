{% extends "encyclopedia/layout.html" %}

{% block title %}
    Search results
{% endblock %}

{% block body %}
    <h1>Search results</h1>
    <h4>{{message}}</h4>
    <ul>
        {% for entry in matches %}
            <a href="{% url 'entry' entry %}">{{ entry }}</a><br>
        {% endfor %}
    </ul>

{% endblock %}
